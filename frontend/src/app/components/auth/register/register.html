<div class="wrap page auth">
  <div class="auth__say">
    <h1 class="display display--xl">Empieza tu álbum.</h1>
    <p class="lede">Con una cuenta puedes calificar partidos, opinar y guardar tus favoritos en listas.</p>
  </div>

  <form class="auth__form" [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
    <h2 class="display display--m">Crear cuenta</h2>

    <p class="note note--error" *ngIf="error" role="alert">{{ error }}</p>

    <label class="field">
      <span class="field__label">Nombre de usuario</span>
      <input class="input" type="text" formControlName="username" autocomplete="username">
    </label>

    <label class="field">
      <span class="field__label">Correo</span>
      <input class="input" type="email" formControlName="email" autocomplete="email" inputmode="email">
    </label>

    <label class="field">
      <span class="field__label">Contraseña</span>
      <input class="input" type="password" formControlName="password" autocomplete="new-password"
        aria-describedby="pista-pass">
      <span class="small muted" id="pista-pass">Mínimo 6 caracteres.</span>
    </label>

    <button class="btn btn--primary btn--lg btn--block" type="submit" [disabled]="loading">
      {{ loading ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>

    <p class="auth__alt">¿Ya tienes cuenta? <a class="link" routerLink="/login">Entra aquí</a></p>
  </form>
</div>
