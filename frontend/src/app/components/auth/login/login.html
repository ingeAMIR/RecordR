<div class="wrap page auth">
  <div class="auth__say">
    <h1 class="display display--xl">Tu álbum te espera.</h1>
    <p class="lede">Entra para calificar partidos, opinar y seguir armando tus listas.</p>
  </div>

  <form class="auth__form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <h2 class="display display--m">Entrar</h2>

    <p class="note note--error" *ngIf="error" role="alert">{{ error }}</p>

    <label class="field">
      <span class="field__label">Correo</span>
      <input class="input" type="email" formControlName="email" autocomplete="email" inputmode="email">
    </label>

    <label class="field">
      <span class="field__label">Contraseña</span>
      <input class="input" type="password" formControlName="password" autocomplete="current-password">
    </label>

    <button class="btn btn--primary btn--lg btn--block" type="submit" [disabled]="loading">
      {{ loading ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="auth__or"><span>o</span></p>
    <div class="auth__google" id="google-btn-container"></div>

    <p class="auth__alt">¿Aún no tienes cuenta? <a class="link" routerLink="/register">Créala aquí</a></p>
  </form>
</div>
